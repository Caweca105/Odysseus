[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.10.2"
actix-cors = "0.7.0"
async-graphql = "7.0.15"
async-graphql-actix-web = "7.0.15"
tokio = { version = "1.44.0", features = ["macros", "rt-multi-thread"] }
env_logger = "0.11.7"
# For Postgres connectivity using an async library (e.g., SQLx)
sqlx = { version = "0.8.3", features = [
    "postgres",
    "runtime-tokio-native-tls",
    "macros",
] }
dotenv = "0.15"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
log = "0.4.26"
tonic = "0.12.3"
prost = "0.13.5"

[build-dependencies]
tonic-build = "0.12.3"
