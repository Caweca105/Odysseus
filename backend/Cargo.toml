[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7.0"
async-graphql = "7.0.15"
async-graphql-actix-web = "7.0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
env_logger = "0.11.6"
# For Postgres connectivity using an async library (e.g., SQLx)
sqlx = { version = "0.8.3", features = [
    "postgres",
    "runtime-tokio-native-tls",
    "macros",
] }
dotenv = "0.15"
